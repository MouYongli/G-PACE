# GRACE's writer with the attribution guard OFF: ablation B (plan 7.3, B; E011), claim-graph arms
# configs/engines/grace-noguard{,-single}.yaml. Identical to configs/common/writer.yaml except
# `guard: false`; keep the two files in step (tests/integration/test_grace_variants.py checks it).
version: 1
prompt: extract-claims             # resources/prompts/extract-claims, pinned in prompts.yaml
schema: extract-claims             # resources/schemas/llm/extract-claims.json
granularity: {unit: session}      # message | segment (size n, inside a session) | session;
                                   # session: E007 main configuration (segment-8 was T013's start)
context_messages: 2                # preceding messages shown for coreference, not extracted
structured_output: json_schema     # the schema as response_format (constrained decoding); or none
split_on_invalid: true             # an invalid output splits the unit in halves, down to messages
max_unit_failures: 2               # failed calls (all client attempts) before a unit is given up
unknown_predicates: local          # local: history-local predicate with the writer's exclusivity;
                                   # drop: items with an unknown predicate are dropped
guard: false                       # E011 ablation B: attribution guard OFF (plan 3.2, 7.3 B)
shacl: true                        # SHACL validation of every change set before commit
max_known_claims: 40               # known claims shown under handles k1, k2, ...
max_predicates: 80
max_entities: 40
recent_versions: 8                 # claims touched in the last n versions are shown first
message_chars: 4000                # longer messages are clipped in the prompt (quotes still
earlier_chars: 600                 # anchor in the full text)
decoding:
  temperature: 0.0                 # D006: temperature 0, thinking disabled (model config)
  seed: 0                          # sent with every call (vLLM per-request seed)
  max_tokens: 12288                # session units (E007): up to the schema bounds of 96 claims and
                                   # 48 stances; 4096 fits a segment-8 unit (writer-segment8.yaml)
