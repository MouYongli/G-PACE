# Development set of the change-sequence generator (task T015) rendered by the paper's renderer:
# Mistral-Small-3.2-24B-Instruct-2506 (decision D006, configs/models/mistral-small-3.2-24b.yaml),
# design docs/research/change-sequences.md section 7. Same cells, seed and event logs as
# dev-smoke.yaml (template renderer); only the surface text differs. Development families only.
dataset: change-seq-dev-model
seed: 20261125
renderer:
  kind: model                     # design section 7; served with the flags of the model config
  model_config: configs/models/mistral-small-3.2-24b.yaml
  prompt: render-changeseq
  workers: 25                     # sequences rendered in parallel (messages stay sequential)
cells:
  - families: [train-travel, flight-travel, car-rental, hotel-stay, apartment-search]
    density: [10]
    length: 200
    schedules: [A20d1, A20d5, U2, U5, U10, U25, U50, P10]
    primary_schedule: A20d1
    sequences_per_family: 2
  - families: [train-travel, flight-travel, car-rental, hotel-stay, apartment-search]
    density: [1, 3, 30]
    length: 200
    schedules: [U10, U2, U5, U25, U50]
    primary_schedule: U10
    sequences_per_family: 1
