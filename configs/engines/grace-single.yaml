# Ablation B, representation arm "open-predicate claim graph" (plan 7.3, B; E011): guard true, time
# single. A copy of configs/engines/grace.yaml with components replaced (no engine branch):
# - the single-time extension (context/pipeline/update/single_time.py): valid times proposed by the
#   writer are dropped before the updater, so the graph keeps transaction time only.
engine: grace
description: GRACE over the open-predicate claim graph (guard true, time single)
prefix_caching: false
writer_model: configs/models/qwen3-32b.yaml
params:
  writer: configs/common/writer.yaml
  planner: configs/common/planner.yaml
  retrieval: configs/retrieval/default.yaml
  assembly: configs/assembly/default.yaml
  views: configs/views/default.yaml
  staleness: {strategy: push_confirm, local_filters: true}
  fragment: {max_predicates: 30, max_entities: 30}
  components:
    extension: {factory: single-time}
embedding:
  hf_repo: Qwen/Qwen3-Embedding-0.6B
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
  served_name: Qwen/Qwen3-Embedding-0.6B
