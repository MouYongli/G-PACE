# Download sources for the benchmarks, each pinned to an exact revision.
# Read by src/grace/cli/data/download.py, which scripts/data/*.sh call.
# A version lands in $PROJECT_ROOT/data/<slug>/<version>/ with MANIFEST.sha256 and SOURCE.json.
# Cards and registry: docs/research/benchmarks.md. The controlled change sequences (change-seq)
# are generated, not downloaded.
#
# Version fields: version, manifest_sha256 (SHA-256 of MANIFEST.sha256, checked after download and
# copied into configs/benchmarks/<slug>.yaml when the data is bound), license, sources.
# Source fields: kind (github | huggingface), repo, revision (full SHA), strip (prefix removed from
# each path), prefix (directory inside the version), files. File fields: path, optional sha256
# (checked after download), optional extract (unpack a zip next to it).

benchmarks:
  multiwoz:
    - version: "2.4"
      manifest_sha256: 78ca9c26ba6859151981b60d5cf23effd50b94594eb294d91e25ed16e481fc35
      license: MIT (repository)
      sources:
        - kind: github
          repo: smartyfh/MultiWOZ2.4
          revision: 6807c1d85f547fcaae10494d26991d2d37c90a63
          strip: data/
          files:
            - {path: data/MULTIWOZ2.4.zip, extract: true}
            - {path: data/README.md}
            - {path: LICENSE}
