# LoCoMo evidence-anchored read points (task T007; plan 6.5). Generated by
# scripts/locomo_read_points.sh (grace.cli.data.locomo_read_points); report:
# docs/work/tasks/T007-locomo-read-points.md. Only `promotion_threshold` is written by hand.
# `histories.<id>.v` maps task ID -> v(q); questions without a read point are under `excluded`.
benchmark: locomo
version: 3eb6f2c
manifest_sha256: c68369667248276b0b7b314d6cf566a877386471ac49f94dada7c9f1ca588ae7
locomo10_sha256: 79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
code_sha: d77ab6344eb6c3ccf7e1d229be209efad8a64ee1
stage: all
token_counter: Qwen/Qwen3-8B@b968826d9c46dd6066d109eabc6255188de91218
definition: v(q) = last version of the session holding the latest annotated evidence turn; every question
  is also read at N (plan 6.5)
promotion_threshold:
  # Fixed on the development histories conv-26 and conv-49 only (T007), committed before any
  # held-out statistic was computed. Applied to the held-out STREAMING questions (complete
  # evidence, not on the audit's evidence-error list); all three must hold for streaming to be
  # reported in the main text (plan 6.5), otherwise it moves to the supplementary material.
  decided_on: dev (conv-26, conv-49)
  first_commit: d77ab6344eb6c3ccf7e1d229be209efad8a64ee1
  min_share_before_final: 0.5          # pooled share of questions with v(q) < N
  min_median_distinct_read_points: 5   # per history, N included
  min_median_gap_tokens: 256           # Qwen3-8B tokens written between adjacent read points
  rationale: >-
    The values are set by principle, not fitted to the development values (0.969, 22, 613.5),
    which pass every criterion by a wide margin. (1) "A substantial share" (plan 6.5) is read as a
    majority: if fewer than half of the questions are posed before the final session, most
    streaming reads coincide with the end-of-history reads and the protocol adds little.
    (2) Staleness strategies differ in cost only when a view is read, invalidated by later writes and read again; with at
    least 4 read points before N per history, each view stored during ingestion has several
    chances to go stale between reads. (3) "Real writes" between adjacent reads means at least as
    many new tokens as the smallest memory budget of the answer prompt (256 tokens,
    configs/common/budgets.yaml), so the new material cannot simply be passed through in context.
    Because v(q) is always a session end, adjacent read points are always at least one whole
    session apart; criterion (3) therefore guards against histories made of very short sessions
    (development gaps: min 405, median 613.5 tokens).
