# GRACE retrieval (plan 5.5; T025): channels, routing and fusion. Loaded by
# grace.context.pipeline.retrieval.retrieve.RetrievalConfig. Development data only: every value
# below is a placeholder until it is frozen on development data at the configuration lock (D012).
version: 1
total: 20            # fused candidates handed to assembly; fixed when a channel is switched off
depth: 20            # candidates per channel before fusion (>= total)
channels: [bm25, dense, graph]   # switch a channel off by removing it (ablation D)
fusion: rrf          # rrf (main configuration) | weighted
rrf_k: 60
weights: {bm25: 1.0, dense: 1.0, graph: 1.0}
routing: rules       # rules | all (always every available channel)
min_confidence: 1    # structural signal families needed before routing narrows the channels
backfill: true       # fill up to `total` from the other enabled channels when routed ones run dry
bm25: {k1: 1.5, b: 0.75}
dense:
