# E013 development diagnosis variant (routing-all, no open items); not a frozen config. Copy of configs/engines/grace.yaml
# with one component replaced.
# GRACE, main configuration (plan section 5; T026 `context/engine.py`, built through the component
# registry `config/registry.py`). Each param names the config of one component; a variant (T027,
# ablations) is a copy of this file with one component replaced, never a branch in the engine.
# Component configs carry their own placeholders until the configuration lock (D012).
engine: grace
description: GRACE, E013 development variant routing-all-no-open
prefix_caching: false
# GRACE's writer model (user decision 2026-11-28, D006 amendment): Qwen3-32B, reached at the run's
# --writer-url; the planner, view rendering and answering stay on the run's model (Qwen3-8B).
writer_model: configs/models/qwen3-32b.yaml
params:
  writer: configs/common/writer.yaml          # T022 writer, session units (E007 main configuration)
  planner: configs/common/planner.yaml        # T023 planner (rules, LLM, one repair)
  retrieval: configs/experiments/E013-dev/retrieval-all.yaml   # routing: all
  assembly: configs/experiments/E013-dev/assembly-no-open.yaml   # open_items: false
  views: configs/views/default.yaml           # T018 resident views; null = no views
  staleness: {strategy: push_confirm, local_filters: true}   # T019 strategy (ablation A arms)
  fragment: {max_predicates: 30, max_entities: 30}           # planner vocabulary fragment
# Embedding model of the dense channel (plan 7.1), reached at the run's --embed-url.
embedding:
  hf_repo: Qwen/Qwen3-Embedding-0.6B
  revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
  served_name: Qwen/Qwen3-Embedding-0.6B
