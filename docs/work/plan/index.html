<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRACE Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #f5f2ea; --surface: #fffdf8; --sunken: #ece8dd; --ink: #1b1a17; --ink-2: #4d4a42; --muted: #8b8679;
  --line: #ddd8ca; --line-2: #c9c3b2; --brand: #cf4a2c; --dot: rgba(27, 26, 23, 0.11);
  --s-planned: #8b8679; --s-proposed: #7b5fb5; --s-active: #2460c7; --s-review: #b36b00; --s-done: #2c7d4f;
  --s-accepted: #2c7d4f; --s-blocked: #c23b34; --s-dropped: #a9a497; --s-rejected: #a9a497; --s-superseded: #a9a497;
  --shadow: 0 1px 2px rgba(27, 26, 23, 0.06), 0 8px 24px rgba(27, 26, 23, 0.08);
  --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1e1d1a; --sunken: #191816; --ink: #efece4; --ink-2: #c4c0b4; --muted: #8e8a7e;
    --line: #33312b; --line-2: #4a473f; --brand: #ef6b4c; --dot: rgba(239, 236, 228, 0.09);
    --s-planned: #8e8a7e; --s-proposed: #a68be0; --s-active: #6c9df2; --s-review: #e0a13a; --s-done: #55b57c;
    --s-accepted: #55b57c; --s-blocked: #ef6b6b; --s-dropped: #5f5c53; --s-rejected: #5f5c53; --s-superseded: #5f5c53;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1e1d1a; --sunken: #191816; --ink: #efece4; --ink-2: #c4c0b4; --muted: #8e8a7e;
  --line: #33312b; --line-2: #4a473f; --brand: #ef6b4c; --dot: rgba(239, 236, 228, 0.09);
  --s-planned: #8e8a7e; --s-proposed: #a68be0; --s-active: #6c9df2; --s-review: #e0a13a; --s-done: #55b57c;
  --s-accepted: #55b57c; --s-blocked: #ef6b6b; --s-dropped: #5f5c53; --s-rejected: #5f5c53; --s-superseded: #5f5c53;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: var(--mono); }

/* ---------- header ---------- */
body > header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 32px; padding: 16px 24px 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 14px; }
.brand h1 { font: 600 26px/1 var(--serif); letter-spacing: -0.01em; margin: 0; }
.brand h1::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-left: 3px; }
.brand span { color: var(--muted); font-size: 12px; }
.stats { display: flex; gap: 26px; padding-bottom: 12px; flex-wrap: wrap; }
.stat { min-width: 64px; }
.stat b { display: block; font: 600 22px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat b small { font: 400 12px var(--sans); color: var(--muted); }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.stat .bar { margin-top: 5px; width: 120px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--s-done); border-radius: 2px; }
nav { display: flex; gap: 2px; margin-left: auto; align-items: flex-end; }
nav a { color: var(--muted); text-decoration: none; padding: 8px 12px 11px; border-bottom: 2px solid transparent; font-weight: 500; }
nav a:hover { color: var(--ink); }
nav a.on { color: var(--ink); border-bottom-color: var(--brand); }
#theme { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 9px; margin: 0 0 9px 10px; font-size: 12px; color: var(--ink-2); }

/* ---------- layout ---------- */
main { flex: 1; display: flex; min-height: 0; position: relative; }
#view { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.msg { padding: 32px 24px; color: var(--ink-2); }
.msg code { font-family: var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.pad { padding: 22px 24px 48px; }
.lede { max-width: 760px; margin: 0 0 20px; }
.lede h2 { font: 600 22px/1.2 var(--serif); margin: 0 0 4px; }
.lede p { margin: 0; color: var(--ink-2); }

/* ---------- status glyph ---------- */
.g { --c: var(--s-planned); display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--c); flex: none; position: relative; vertical-align: -1px; }
.g.proposed { --c: var(--s-proposed); border-style: dotted; }
.g.active { --c: var(--s-active); background: linear-gradient(90deg, var(--c) 50%, transparent 50%); }
.g.review { --c: var(--s-review); background: conic-gradient(var(--c) 75%, transparent 0); }
.g.done, .g.accepted { --c: var(--s-done); background: var(--c); }
.g.done::after, .g.accepted::after { content: ""; position: absolute; left: 2px; top: 0; width: 2.5px; height: 5px; border: solid var(--surface); border-width: 0 1.5px 1.5px 0; transform: rotate(40deg); }
.g.blocked { --c: var(--s-blocked); background: var(--c); border-radius: 2px; }
.g.dropped, .g.rejected, .g.superseded { --c: var(--s-dropped); background: linear-gradient(45deg, transparent 42%, var(--c) 42%, var(--c) 58%, transparent 58%); }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); font-size: 12px; }
.tag { font: 500 10px/1 var(--mono); letter-spacing: 0.04em; padding: 3px 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; text-transform: uppercase; }
.tag.ready { border-color: var(--ink); color: var(--ink); }
.tag.end { background: var(--brand); border-color: var(--brand); color: #fff; }
.tag.plain { border: 0; padding: 3px 0; color: var(--muted); }

/* ---------- graph ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 24px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--ink-2); }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip small { font: 400 10px var(--mono); opacity: 0.7; }
.toolbar .sep { flex: 1; }
.gate { padding: 10px 24px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: flex; gap: 12px; align-items: baseline; }
.gate b { font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand); flex: none; }
.gate a { white-space: nowrap; }
#canvas { flex: 1; min-height: 380px; position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none;
  background: radial-gradient(var(--dot) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--bg); }
#canvas.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.e { fill: none; stroke: var(--line-2); stroke-width: 1.3; transition: opacity 0.15s; }
.e.dec { stroke-dasharray: 4 4; }
.e.sat { stroke: var(--s-done); opacity: 0.45; }
.e.chain { stroke: var(--ink-2); stroke-width: 2.2; }
.e.hl { stroke: var(--ink); stroke-width: 2; opacity: 1; }
.e.dim { opacity: 0.08; }
.n { --bd: var(--line-2); --fill: var(--surface); --bw: 1px; position: absolute; width: 204px; height: 66px; cursor: pointer; transition: opacity 0.15s, filter 0.15s; }
.n .shape { position: absolute; inset: 0; background: var(--fill); border: var(--bw) solid var(--bd); border-radius: 9px; }
.n.experiment .shape { border-radius: 33px; }
.n.decision .shape { border: 0; border-radius: 0; background: var(--bd); clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%); }
.n.decision .shape::before { content: ""; position: absolute; inset: calc(var(--bw) + 0.4px); background: var(--fill); clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%); }
.n .body { position: absolute; inset: 0; padding: 9px 13px; display: flex; flex-direction: column; gap: 4px; }
.n.experiment .body, .n.decision .body { padding: 9px 23px; }
.n .top { display: flex; align-items: center; gap: 6px; }
.n .top b { font: 600 11px/1 var(--mono); letter-spacing: 0.02em; }
.n .top .sp { flex: 1; }
.n .top .tag { font-size: 9px; padding: 2px 4px; }
.n .title { font-size: 12px; line-height: 1.25; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.n.ready { --bd: var(--ink-2); --bw: 1.5px; }
.n.ready .title, .n.live .title { color: var(--ink); }
.n.s-active { --bd: var(--s-active); --bw: 2px; --fill: color-mix(in srgb, var(--s-active) 9%, var(--surface)); }
.n.s-review { --bd: var(--s-review); --bw: 2px; --fill: color-mix(in srgb, var(--s-review) 10%, var(--surface)); }
.n.s-blocked { --bd: var(--s-blocked); --bw: 2px; --fill: color-mix(in srgb, var(--s-blocked) 9%, var(--surface)); }
.n.res { --bd: color-mix(in srgb, var(--s-done) 50%, var(--surface)); --fill: color-mix(in srgb, var(--s-done) 9%, var(--surface)); }
.n.gone { opacity: 0.5; }
.n.gone .title { text-decoration: line-through; }
.n.chain:not(.s-active):not(.s-review):not(.s-blocked):not(.res) { --bd: var(--ink-2); --bw: 2px; }
.n.end { --bd: var(--brand) !important; --bw: 2px; }
.n.ghost { opacity: 0.5; }
.n.dim { opacity: 0.13; }
.n:hover, .n.sel { filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18)); }
.n.sel { --bd: var(--ink) !important; --bw: 2.5px !important; opacity: 1; }
.zoom { position: absolute; right: 16px; top: 14px; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.zoom button { border: 0; background: transparent; width: 32px; height: 30px; font-size: 15px; color: var(--ink-2); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--sunken); color: var(--ink); }
.legend { position: absolute; left: 16px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 16px; max-width: calc(100% - 32px); padding: 8px 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; color: var(--ink-2); cursor: default; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .shp { width: 18px; height: 10px; border: 1.3px solid var(--ink-2); border-radius: 2px; }
.legend .shp.x { border-radius: 6px; }
.legend .shp.d { border: 0; background: var(--ink-2); clip-path: polygon(4px 0, 14px 0, 18px 50%, 14px 100%, 4px 100%, 0 50%); }
.legend .ln { width: 20px; height: 0; border-top: 1.5px solid var(--line-2); }
.legend .ln.dec { border-top-style: dashed; }
.legend .ln.chain { border-top: 2.4px solid var(--ink-2); }
.legend em { font-style: normal; color: var(--muted); border-left: 1px solid var(--line); padding-left: 14px; }

/* ---------- cards (waves, milestones) ---------- */
.nc { display: block; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
.nc:hover { border-color: var(--ink-2); }
.nc .top { display: flex; align-items: center; gap: 6px; }
.nc .top b { font: 600 11px/1 var(--mono); }
.nc .top .sp { flex: 1; }
.nc .title { font-size: 13px; line-height: 1.3; margin-top: 4px; }
.nc .waits { font: 400 11px var(--mono); color: var(--muted); margin-top: 5px; }
.nc.experiment { border-radius: 18px; padding: 9px 15px; }
.nc.decision { border-style: dashed; }
.nc.s-active { border-color: var(--s-active); border-width: 2px; }
.nc.res { background: transparent; }
.nc.res .title { color: var(--muted); }
.waves { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 16px; }
.wave { flex: none; width: 236px; }
.wave header { position: sticky; top: 0; padding: 0 2px 10px; border-bottom: 2px solid var(--ink); margin-bottom: 10px; }
.wave.done header { border-bottom-color: var(--s-done); }
.wave header .wn { font: 600 28px/1 var(--serif); font-variant-numeric: tabular-nums; }
.wave header b { display: block; font-size: 12px; margin-top: 4px; }
.wave header small { color: var(--muted); font-size: 11px; }
.wave header .w { height: 4px; border-radius: 2px; background: var(--ink-2); margin-top: 8px; min-width: 4px; }
.wave .stack { display: flex; flex-direction: column; gap: 7px; }
.wave h4 { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 8px 2px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.card .head { display: flex; gap: 14px; align-items: flex-start; }
.card .num { font: 600 34px/0.9 var(--serif); color: var(--line-2); }
.card.s-active .num { color: var(--s-active); }
.card.s-done .num { color: var(--s-done); }
.card h3 { font: 600 17px/1.2 var(--serif); margin: 0 0 4px; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.card .gatetext { font-size: 12.5px; color: var(--ink-2); border-left: 2px solid var(--brand); padding-left: 10px; margin: 0; }
.card ul { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); }
.card li a { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; text-decoration: none; font-size: 13px; }
.card li a:hover span { text-decoration: underline; }
.card li b { font: 500 11px var(--mono); color: var(--ink-2); flex: none; width: 36px; }
.card li .g { align-self: center; }
.card li.res span { color: var(--muted); }

/* ---------- table ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
select, input[type="search"] { font: inherit; padding: 5px 9px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; }
input[type="search"] { min-width: 220px; }
table.list { border-collapse: collapse; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table.list th { font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
table.list td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list tr[data-id] { cursor: pointer; }
table.list tr[data-id]:hover { background: var(--sunken); }
table.list td.id { font: 600 12px var(--mono); white-space: nowrap; }
table.list td.dep { font: 400 11px var(--mono); color: var(--muted); }
table.list td.num { font-variant-numeric: tabular-nums; }

/* ---------- timeline ---------- */
.tl .row { display: grid; grid-template-columns: 260px 1fr; align-items: center; min-height: 28px; }
.tl .row a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; font-size: 13px; }
.tl .row.ms a { font-weight: 600; }
.tl .track { position: relative; height: 20px; border-left: 1px solid var(--line); }
.tl .seg { position: absolute; top: 5px; height: 10px; border-radius: 5px; min-width: 5px; }
.tl .today { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--brand); }
.tl .axis { color: var(--muted); font: 400 11px var(--mono); display: flex; justify-content: space-between; }

/* ---------- detail ---------- */
aside#detail { width: min(540px, 46%); border-left: 1px solid var(--line); background: var(--surface); overflow: auto; padding: 18px 24px 48px; box-shadow: var(--shadow); z-index: 2; }
aside#detail[hidden] { display: none; }
aside .bar-top { display: flex; gap: 8px; margin-bottom: 16px; }
aside .bar-top button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 3px 10px; font-size: 12px; }
aside .bar-top button:hover { border-color: var(--ink-2); }
aside .kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
aside .kicker b { font: 600 13px var(--mono); }
aside h2 { font: 600 23px/1.2 var(--serif); margin: 8px 0 14px; }
aside dl { display: grid; grid-template-columns: max-content 1fr; gap: 7px 16px; font-size: 13px; margin: 0 0 18px; }
aside dt { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 2px; }
aside dd { margin: 0; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
aside dd a.ref { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
aside dd a.ref:hover { border-color: var(--ink-2); }
.md { border-top: 1px solid var(--line); padding-top: 6px; font-size: 13.5px; color: var(--ink-2); }
.md h1 { display: none; }
.md h2 { font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 6px; }
.md ul { padding-left: 18px; }
.md table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 5px 8px 5px 0; text-align: left; vertical-align: top; }
.md code { font: 400 12px var(--mono); background: var(--sunken); padding: 1px 4px; border-radius: 3px; }
.md pre { background: var(--sunken); padding: 10px; overflow: auto; border-radius: 6px; }
/* ---------- editing ---------- */
nav a#changes-link { color: var(--brand); }
nav a#changes-link[hidden] { display: none; }
.tag.edited { border-color: var(--brand); color: var(--brand); }
.edit { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 18px; background: var(--bg); }
.edit h3 { font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.edit .grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; align-items: center; font-size: 13px; }
.edit label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.edit input, .edit select { font: inherit; padding: 5px 9px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; min-width: 0; width: 100%; }
.edit .was { grid-column: 2; font: 400 11px var(--mono); color: var(--muted); margin-top: -4px; }
.edit .actions, .changes .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 5px 12px; font-size: 13px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.danger { color: var(--s-blocked); }
.err { color: var(--s-blocked); font-size: 12.5px; margin: 10px 0 0; padding-left: 18px; }
.note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
.changes { max-width: 900px; }
.changes table.list td.from { color: var(--muted); text-decoration: line-through; }
.changes pre { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font: 400 12px/1.5 var(--mono); margin: 14px 0 0; }
.changes ol { color: var(--ink-2); padding-left: 20px; }
.changes ol code, .changes p code { font-family: var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 10; box-shadow: var(--shadow); }
@media (max-width: 820px) {
  body > header { padding: 12px 16px 0; }
  nav { margin-left: 0; overflow-x: auto; width: 100%; }
  .pad { padding: 16px 16px 40px; }
  .toolbar, .gate { padding-left: 16px; padding-right: 16px; }
  aside#detail { position: absolute; inset: 0; width: 100%; border-left: 0; }
  .tl .row { grid-template-columns: 130px 1fr; }
  .legend em { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="title">Plan</h1><span id="updated"></span></div>
  <div class="stats" id="stats"></div>
  <nav>
    <a href="#/graph" data-view="graph">Graph</a>
    <a href="#/waves" data-view="waves">Waves</a>
    <a href="#/milestones" data-view="milestones">Milestones</a>
    <a href="#/table" data-view="table">Table</a>
    <a href="#/timeline" data-view="timeline">Timeline</a>
    <a href="#/changes" data-view="changes" id="changes-link" hidden>Changes</a>
    <button id="theme" title="Switch colour theme">auto</button>
  </nav>
</header>
<main>
  <section id="view"></section>
  <aside id="detail" hidden></aside>
</main>
<script>
"use strict";
const RESOLVED = new Set(["done", "dropped", "accepted", "rejected", "superseded"]);
const GONE = new Set(["dropped", "rejected", "superseded"]);
const STARTED = new Set(["active", "review", "blocked"]);
const NW = 204, NH = 66;
const state = {
  plan: null, nodes: new Map(), ms: new Map(), dependents: new Map(), optional: new Set(), deliverables: new Set(),
  chain: new Set(), chainEdges: new Set(), maxWave: 0, lastView: "graph", graph: null,
  opts: { chain: true, hideOptional: false, hideResolved: false },
  raw: "", base: new Map(), edits: new Map(), editing: null,
};

const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k);
  return e;
}
const svg = (tag, attrs = {}) => {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const glyph = (status) => el("i", { class: "g " + status, title: status });
const st = (status) => el("span", { class: "st" }, glyph(status), status);
const resolved = (n) => RESOLVED.has(n.status);
const deps = (n) => (n.depends_on || []).filter((d) => state.nodes.has(d));

/* ---------- load and analyse ---------- */
async function load() {
  let text;
  try {
    const res = await fetch("plan.yaml", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    text = await res.text();
  } catch (err) {
    $("#view").replaceChildren(el("div", { class: "msg" },
      "Could not load plan.yaml (" + err.message + "). Serve the repository over HTTP: ",
      el("code", {}, 'cd "$PROJECT_ROOT" && python3 -m http.server 8000'),
      ", then open ", el("code", {}, "http://localhost:8000/docs/work/plan/"), "."));
    return;
  }
  const plan = jsyaml.load(text);
  state.plan = plan;
  state.raw = text;
  for (const m of plan.milestones || []) state.ms.set(m.id, m);
  for (const n of plan.nodes || []) {
    state.nodes.set(n.id, n);
    state.dependents.set(n.id, []);
    state.base.set(n.id, fieldsOf(n));
  }
  for (const n of state.nodes.values()) for (const d of deps(n)) state.dependents.get(d).push(n.id);
  state.optional = new Set(plan.optional || []);
  state.deliverables = new Set(plan.deliverables || (plan.end ? [plan.end] : []));
  restoreEdits();
  analyse();
  initTheme();
  renderHeader();
  window.addEventListener("hashchange", route);
  route();
}

// wave: 0 for resolved nodes; otherwise 1 + the largest wave among unresolved dependencies.
// Nodes in the same wave do not depend on each other, so a wave can run in parallel.
function analyse() {
  const wave = new Map(), down = new Map();
  state.chain = new Set();
  state.chainEdges = new Set();
  const w = (id) => {
    if (wave.has(id)) return wave.get(id);
    const n = state.nodes.get(id);
    const v = resolved(n) ? 0 : 1 + Math.max(0, ...deps(n).map(w));
    wave.set(id, v);
    return v;
  };
  const dn = (id) => {
    if (down.has(id)) return down.get(id);
    const n = state.nodes.get(id);
    const v = resolved(n) ? 0 : 1 + Math.max(0, ...state.dependents.get(id).map(dn));
    down.set(id, v);
    return v;
  };
  for (const n of state.nodes.values()) {
    n.wave = w(n.id);
    n.down = dn(n.id);
    n.started = STARTED.has(n.status);
    n.ready = n.wave === 1 && !n.started;
  }
  state.maxWave = Math.max(0, ...wave.values());
  // one longest chain of unresolved nodes, preferring the one that ends at the end node
  const end = state.plan.end && state.nodes.get(state.plan.end);
  let cur = end && !resolved(end) && end.wave === state.maxWave ? end
    : [...state.nodes.values()].find((n) => n.wave === state.maxWave && n.wave > 0);
  while (cur) {
    state.chain.add(cur.id);
    const prev = deps(cur).map((d) => state.nodes.get(d)).find((d) => d.wave === cur.wave - 1 && d.wave > 0);
    if (prev) state.chainEdges.add(prev.id + ">" + cur.id);
    cur = prev;
  }
}

function msNodes(mid) { return [...state.nodes.values()].filter((n) => n.milestone === mid); }
function progress(nodes) {
  const live = nodes.filter((n) => !GONE.has(n.status));
  const done = live.filter(resolved).length;
  return { done, total: live.length, pct: live.length ? Math.round((100 * done) / live.length) : 0 };
}
function msStatus(m) {
  if (m.status) return m.status;
  const nodes = msNodes(m.id);
  if (!nodes.length) return "planned";
  if (nodes.every(resolved)) return "done";
  if (nodes.some((n) => n.status === "blocked")) return "blocked";
  if (nodes.some((n) => n.started || resolved(n))) return "active";
  return "planned";
}
// milestone order is derived from node dependencies that cross milestones
function msAfter(mid) {
  const out = new Set();
  for (const n of msNodes(mid)) for (const d of deps(n)) {
    const dm = state.nodes.get(d).milestone;
    if (dm && dm !== mid) out.add(dm);
  }
  return [...out].sort();
}

function renderHeader() {
  const p = state.plan, all = [...state.nodes.values()], pr = progress(all);
  document.title = (p.project || "Project") + " Plan";
  $("#title").textContent = p.project || "Project";
  const upd = p.updated instanceof Date ? p.updated.toISOString().slice(0, 10) : p.updated;
  $("#updated").textContent = "project plan" + (upd ? " · updated " + upd : "");
  const widths = new Map();
  for (const n of all) if (n.wave > 0) widths.set(n.wave, (widths.get(n.wave) || 0) + 1);
  const stat = (value, label, extra) => el("div", { class: "stat" }, value, el("span", {}, label), extra);
  const big = (a, b) => { const e = el("b", {}, String(a)); if (b != null) e.append(el("small", {}, " / " + b)); return e; };
  $("#stats").replaceChildren(
    stat(big(pr.done, pr.total), "resolved", el("div", { class: "bar" }, el("i", { style: `width:${pr.pct}%` }))),
    stat(big(all.filter((n) => n.started).length), "in progress"),
    stat(big(all.filter((n) => n.ready).length), "ready now"),
    stat(big(state.maxWave), "waves left"),
    stat(big(Math.max(0, ...widths.values())), "widest wave"));
  const link = $("#changes-link");
  link.hidden = state.edits.size === 0;
  link.textContent = "Changes · " + state.edits.size;
}
function initTheme() {
  const btn = $("#theme");
  const modes = ["auto", "light", "dark"];
  let mode = "auto";
  try { mode = localStorage.getItem("plan-theme") || "auto"; } catch (e) { /* storage unavailable */ }
  const apply = () => {
    if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = mode;
    btn.textContent = mode;
  };
  btn.addEventListener("click", () => {
    mode = modes[(modes.indexOf(mode) + 1) % 3];
    try { localStorage.setItem("plan-theme", mode); } catch (e) { /* storage unavailable */ }
    apply();
  });
  apply();
}

/* ---------- routing ---------- */
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const view = parts[0] || "graph";
  if (view === "node") {
    if (!$("#view").dataset.view) renderView(state.lastView.split("/"));
    openDetail(parts[1]);
    return;
  }
  closeDetail();
  const key = parts.join("/") || "graph";
  if ($("#view").dataset.key === key) return;
  state.lastView = key;
  renderView(parts.length ? parts : ["graph"]);
}
function renderView([view, arg]) {
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.view === view));
  const root = $("#view");
  root.replaceChildren();
  root.dataset.view = view;
  root.dataset.key = [view, arg].filter(Boolean).join("/");
  state.graph = null;
  if (view === "waves") return renderWaves(root);
  if (view === "milestones") return renderMilestones(root);
  if (view === "table") return renderTable(root);
  if (view === "timeline") return renderTimeline(root);
  if (view === "changes") return renderChanges(root);
  return renderGraph(root, arg);
}
const rerender = () => renderView(state.lastView.split("/"));

/* ---------- graph ---------- */
function flags(n) {
  const out = [];
  if (n.id === state.plan.end) out.push(el("span", { class: "tag end" }, "end"));
  else if (state.deliverables.has(n.id)) out.push(el("span", { class: "tag end" }, "deliverable"));
  if (n.ready) out.push(el("span", { class: "tag ready" }, "ready"));
  if (state.optional.has(n.id)) out.push(el("span", { class: "tag" }, "opt"));
  if (state.edits.has(n.id)) out.push(el("span", { class: "tag edited", title: "Changed in this browser, not yet exported" }, "edited"));
  return out;
}
function nodeClass(n) {
  return [n.type, "s-" + n.status, resolved(n) && "res", GONE.has(n.status) && "gone", n.ready && "ready",
    n.started && "live", n.id === state.plan.end && "end"].filter(Boolean).join(" ");
}

function renderGraph(root, arg) {
  const m = arg && state.ms.get(arg);
  const o = state.opts;
  const keep = (n) => !(o.hideOptional && state.optional.has(n.id)) && !(o.hideResolved && resolved(n));
  const scope = (m ? msNodes(m.id) : [...state.nodes.values()]).filter(keep);
  const ids = new Set(scope.map((n) => n.id));
  const ghosts = new Set();
  if (m) for (const n of scope) {
    for (const d of deps(n)) if (!ids.has(d) && keep(state.nodes.get(d))) ghosts.add(d);
    for (const d of state.dependents.get(n.id)) if (!ids.has(d) && keep(state.nodes.get(d))) ghosts.add(d);
  }
  const shown = new Set([...ids, ...ghosts]);
  const edges = [];
  for (const id of shown) for (const d of deps(state.nodes.get(id))) {
    if (shown.has(d) && (ids.has(id) || ids.has(d))) edges.push([d, id]);
  }

  // toolbar
  const chips = el("div", { class: "chips" }, el("a", { class: "chip" + (m ? "" : " on"), href: "#/graph" }, "All"));
  for (const x of state.ms.values()) {
    const p = progress(msNodes(x.id));
    chips.append(el("a", { class: "chip" + (m && m.id === x.id ? " on" : ""), href: "#/graph/" + x.id, title: x.title },
      x.id, el("small", {}, `${p.done}/${p.total}`)));
  }
  const toggle = (key, label) => {
    const b = el("button", { class: "chip" + (o[key] ? " on" : "") }, label);
    b.addEventListener("click", () => { o[key] = !o[key]; rerender(); });
    return b;
  };
  root.append(el("div", { class: "toolbar" }, chips, el("span", { class: "sep" }),
    el("div", { class: "chips" }, toggle("chain", "Longest chain"), toggle("hideOptional", "Core only"), toggle("hideResolved", "Hide resolved"))));
  if (m) {
    const p = progress(msNodes(m.id));
    root.append(el("div", { class: "gate" }, el("b", {}, m.id + " gate"),
      el("span", {}, `${m.title} · ${p.done}/${p.total} resolved. ${m.gate || ""} `,
        m.gate_node && state.nodes.has(m.gate_node) ? el("a", { href: "#/node/" + m.gate_node }, "Decided in " + m.gate_node + " →") : null)));
  }
  const canvas = el("div", { id: "canvas" });
  root.append(canvas);
  if (!shown.size) { canvas.replaceWith(el("div", { class: "msg" }, "No nodes to show with these filters.")); return; }

  // layout
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: "LR", nodesep: 16, ranksep: 64, marginx: 48, marginy: 48 });
  g.setDefaultEdgeLabel(() => ({}));
  for (const id of shown) g.setNode(id, { width: NW, height: NH });
  for (const [a, b] of edges) g.setEdge(a, b);
  dagre.layout(g);
  const gw = g.graph().width, gh = g.graph().height;

  const world = el("div", { id: "world", style: `width:${gw}px;height:${gh}px` });
  const layer = svg("svg", { width: gw, height: gh });
  const defs = svg("defs");
  for (const [id, color] of [["a0", "var(--line-2)"], ["a1", "var(--ink-2)"], ["a2", "var(--ink)"], ["a3", "var(--s-done)"]]) {
    const mk = svg("marker", { id, viewBox: "0 0 10 10", refX: 8.5, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse", markerUnits: "userSpaceOnUse" });
    const tip = svg("path", { d: "M1 1.5 L9 5 L1 8.5 z" });
    tip.style.fill = color;
    mk.append(tip);
    defs.append(mk);
  }
  layer.append(defs);
  const edgeEls = [];
  for (const [a, b] of edges) {
    const pts = g.edge(a, b).points;
    let d = `M${pts[0].x} ${pts[0].y}`;
    if (pts.length === 2) d += ` L${pts[1].x} ${pts[1].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const last = i === pts.length - 2;
      const ex = last ? pts[i + 1].x : (pts[i].x + pts[i + 1].x) / 2, ey = last ? pts[i + 1].y : (pts[i].y + pts[i + 1].y) / 2;
      d += ` Q${pts[i].x} ${pts[i].y} ${ex} ${ey}`;
    }
    const from = state.nodes.get(a);
    const onChain = o.chain && state.chainEdges.has(a + ">" + b);
    const sat = resolved(from) && !onChain;
    const p = svg("path", { d, class: "e" + (from.type === "decision" ? " dec" : "") + (sat ? " sat" : "") + (onChain ? " chain" : "") });
    p.dataset.base = onChain ? "a1" : sat ? "a3" : "a0";
    p.setAttribute("marker-end", `url(#${p.dataset.base})`);
    layer.append(p);
    edgeEls.push({ a, b, p });
  }
  world.append(layer);
  const nodeEls = new Map();
  for (const id of shown) {
    const n = state.nodes.get(id), pos = g.node(id);
    const cls = "n " + nodeClass(n) + (ghosts.has(id) ? " ghost" : "") + (o.chain && state.chain.has(id) ? " chain" : "");
    const e = el("div", { class: cls, "data-id": id, style: `left:${pos.x - NW / 2}px;top:${pos.y - NH / 2}px`,
      title: `${id} · ${n.title}\n${n.type} · ${n.status}${n.wave ? " · wave " + n.wave : ""}` },
      el("div", { class: "shape" }),
      el("div", { class: "body" },
        el("div", { class: "top" }, glyph(n.status), el("b", {}, id), el("span", { class: "sp" }), flags(n),
          !m || ghosts.has(id) ? el("span", { class: "tag plain" }, n.milestone || "—") : null),
        el("div", { class: "title" }, n.title)));
    world.append(e);
    nodeEls.set(id, e);
  }
  canvas.append(world);

  // lineage highlight
  const up = new Map(), dn = new Map();
  for (const id of shown) { up.set(id, []); dn.set(id, []); }
  for (const [a, b] of edges) { up.get(b).push(a); dn.get(a).push(b); }
  const walk = (start, adj) => { const seen = new Set([start]), q = [start]; while (q.length) for (const x of adj.get(q.pop()) || []) if (!seen.has(x)) { seen.add(x); q.push(x); } return seen; };
  let hover = null, selected = null;
  function paint() {
    const focus = hover || selected;
    const anc = focus && shown.has(focus) ? walk(focus, up) : null, desc = anc ? walk(focus, dn) : null;
    for (const [id, e] of nodeEls) {
      e.classList.toggle("dim", !!anc && !anc.has(id) && !desc.has(id));
      e.classList.toggle("sel", id === selected);
    }
    for (const { a, b, p } of edgeEls) {
      const on = !!anc && ((anc.has(a) && anc.has(b)) || (desc.has(a) && desc.has(b)));
      p.classList.toggle("hl", on);
      p.classList.toggle("dim", !!anc && !on);
      p.setAttribute("marker-end", `url(#${on ? "a2" : p.dataset.base})`);
    }
  }

  // pan and zoom
  const t = { x: 0, y: 0, k: 1 };
  const apply = () => { world.style.transform = `translate(${t.x}px,${t.y}px) scale(${t.k})`; };
  const zoomAt = (cx, cy, f) => {
    const k = Math.min(2, Math.max(0.2, t.k * f));
    t.x = cx - ((cx - t.x) * k) / t.k; t.y = cy - ((cy - t.y) * k) / t.k; t.k = k;
    apply();
  };
  function fit(all) {
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    let k = Math.min(cw / gw, ch / gh, 1);
    if (!all && k < 0.62) {
      // too large to read at full fit: open on the frontier (first unresolved wave)
      k = 0.72;
      const front = [...ids].map((id) => ({ n: state.nodes.get(id), p: g.node(id) })).filter((x) => x.n.wave === 1);
      const fx = front.length ? Math.min(...front.map((x) => x.p.x)) : NW;
      const fy = front.length ? front.reduce((s, x) => s + x.p.y, 0) / front.length : gh / 2;
      t.k = k; t.x = Math.min(40, cw * 0.22 - fx * k);
      t.y = Math.min(20, Math.max(ch - gh * k - 20, ch / 2 - fy * k));
    } else { t.k = k; t.x = (cw - gw * k) / 2; t.y = (ch - gh * k) / 2; }
    apply();
  }
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".zoom, .legend")) return;
    drag = { x: e.clientX, y: e.clientY, tx: t.x, ty: t.y, moved: false, id: e.target.closest(".n")?.dataset.id };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    canvas.classList.add("drag");
    t.x = drag.tx + dx; t.y = drag.ty + dy;
    apply();
  });
  const drop = (e) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    canvas.classList.remove("drag");
    if (e.type === "pointerup" && !d.moved && d.id) location.hash = "#/node/" + d.id;
  };
  canvas.addEventListener("pointerup", drop);
  canvas.addEventListener("pointercancel", drop);
  world.addEventListener("mouseover", (e) => { const id = e.target.closest(".n")?.dataset.id || null; if (id !== hover && !drag) { hover = id; paint(); } });
  world.addEventListener("mouseleave", () => { hover = null; paint(); });

  const zb = (label, title, fn) => { const b = el("button", { title }, label); b.addEventListener("click", fn); return b; };
  const mid = (f) => () => zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, f);
  canvas.append(el("div", { class: "zoom" }, zb("+", "Zoom in", mid(1.25)), zb("−", "Zoom out", mid(0.8)), zb("⤢", "Fit everything", () => fit(true))));
  const lg = el("div", { class: "legend" });
  for (const s of ["planned", "proposed", "active", "review", "done", "blocked"]) lg.append(el("span", {}, glyph(s), s === "done" ? "done / accepted" : s));
  lg.append(el("span", {}, el("i", { class: "shp" }), "task"), el("span", {}, el("i", { class: "shp x" }), "experiment"),
    el("span", {}, el("i", { class: "shp d" }), "decision"), el("span", {}, el("i", { class: "ln" }), "must finish first"),
    el("span", {}, el("i", { class: "ln dec" }), "from a decision"), el("span", {}, el("i", { class: "ln chain" }), "longest remaining chain"),
    el("em", {}, "drag to pan · scroll to zoom · hover a node for its lineage"));
  canvas.append(lg);

  state.graph = { select(id) { selected = id; paint(); } };
  requestAnimationFrame(() => fit(false));
}

/* ---------- waves ---------- */
function card(n, waits) {
  const open = waits ? deps(n).filter((d) => !resolved(state.nodes.get(d))) : [];
  return el("a", { class: "nc " + nodeClass(n), href: "#/node/" + n.id, title: `${n.type} · ${n.status}` },
    el("div", { class: "top" }, glyph(n.status), el("b", {}, n.id), el("span", { class: "sp" }), flags(n).filter((f) => f.textContent !== "ready"),
      el("span", { class: "tag plain" }, n.milestone || "—")),
    el("div", { class: "title" }, n.title),
    open.length ? el("div", { class: "waits" }, "after " + open.join(" ")) : null);
}
function renderWaves(root) {
  const all = [...state.nodes.values()];
  const box = el("div", { class: "pad" });

/* ---------- export ---------- */
function yamlScalar(field, v) {

  else out[top] = setLine(out[top], "", "updated", today());
  const nodesAt = out.findIndex((l) => /^nodes:\s*(#.*)?$/.test(l));
  if (nodesAt < 0) errors.push("No top-level nodes: list found.");
  for (const [id, f] of state.edits) {
    if (nodesAt < 0) break;
    const head = out.findIndex((l, i) => i > nodesAt && new RegExp("^(\\s*)- id:\\s*" + id + "\\s*(#.*)?$").test(l));
    if (head < 0) { errors.push(`Node ${id} not found in plan.yaml.`); continue; }

      const at = out.findIndex((l, i) => i > head && i < end && l.startsWith(fieldIndent + k + ":"));
      if (at < 0) { errors.push(`Field ${k} of ${id} not found in plan.yaml.`); continue; }

      for (const [id, f] of state.edits) {

  if (!state.edits.size) { box.append(el("p", {}, "No pending changes. Open a node and choose Edit.")); return; }
  const rows = [];
  for (const id of [...state.edits.keys()].sort()) {
    const base = state.base.get(id), f = state.edits.get(id), n = state.nodes.get(id);
    for (const k of changedFields(id)) {
      const tr = el("tr", { "data-id": id },
        el("td", { class: "id" }, id), el("td", {}, n.title), el("td", { class: "mono" }, k),
        el("td", { class: "from mono" }, String(base[k] ?? "null")), el("td", { class: "mono" }, String(f[k] ?? "null")));
      tr.addEventListener("click", () => { location.hash = "#/node/" + id; });
      rows.push(tr);
    }
  }
  box.append(el("table", { class: "list" },
    el("thead", {}, el("tr", {}, ...["ID", "Title", "Field", "In file", "New"].map((h) => el("th", {}, h)))),
    el("tbody", {}, rows)));
  const { text, diff, errors } = buildExport();
  if (errors.length) {
    box.append(el("ul", { class: "err" }, errors.map((e) => el("li", {}, e))),
      el("p", { class: "note" }, "Export is disabled until this is resolved. Reload the page if plan.yaml changed on disk."));
  }
  const btn = (label, cls, fn) => { const b = el("button", { class: "btn " + cls }, label); b.addEventListener("click", fn); if (errors.length && cls !== "danger") b.disabled = true; return b; };
  box.append(el("div", { class: "actions" },
    btn("Download plan.yaml", "primary", () => download(text, "plan.yaml")),
    btn("Copy plan.yaml", "", () => copy(text, "plan.yaml copied")),
    btn("Copy diff", "", () => copy(diff, "Diff copied")),
    btn("Discard all", "danger", () => {
      if (!confirm("Discard all pending changes?")) return;
      for (const id of [...state.edits.keys()]) setFields(state.nodes.get(id), state.base.get(id));
      state.edits.clear();
      afterEdit();
    })));
  box.append(el("h3", {}, "Bring the changes to main"),
    el("ol", {},
      el("li", {}, "In your own worktree on a ", el("code", {}, "chore/<slug>"), " branch cut from ", el("code", {}, "main"), ", replace ", el("code", {}, "docs/work/plan/plan.yaml"), " with the downloaded file (or apply the diff with ", el("code", {}, "git apply --unidiff-zero"), ")."),
      el("li", {}, "Run ", el("code", {}, "make test"), ", commit, push and open a PR to ", el("code", {}, "main"), "."),
      el("li", {}, "After the PR is merged, choose Discard all here and reload.")),
    el("p", { class: "note" }, "Only the changed field lines and updated: are rewritten; comments and layout of plan.yaml are kept. The diff has no context lines."),
    el("pre", {}, diff));
}
function download(text, name) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "text/yaml" })), download: name });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = el("textarea", { style: "position:fixed;opacity:0" });
    t.value = text;
    document.body.append(t);
    t.select();
    document.execCommand("copy");
    t.remove();
  }
  toast(done);
}
function toast(msg) {
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- pending edits in browser storage ----------
   Kept per viewer and tied to the exact plan.yaml text they were made on; if the file changes,
   the stored edits no longer apply and are dropped. */
function hashText(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const editsKey = () => "plan-edits:" + hashText(state.raw);
function saveEdits() {
  try {
    if (state.edits.size) localStorage.setItem(editsKey(), JSON.stringify(Object.fromEntries(state.edits)));
    else localStorage.removeItem(editsKey());
  } catch (e) { /* storage unavailable */ }
}
function restoreEdits() {
  let saved = null, stale = 0;
  try {
    const key = editsKey();
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith("plan-edits:") && k !== key) { localStorage.removeItem(k); stale++; }
    }
    saved = JSON.parse(localStorage.getItem(key) || "null");
  } catch (e) { saved = null; }
  if (saved && typeof saved === "object") {
    for (const [id, f] of Object.entries(saved)) {
      const n = state.nodes.get(id);
      if (!n || !f || validate(n, f).length) continue;
      state.edits.set(id, f);
      setFields(n, f);
    }
  }
  if (stale) setTimeout(() => toast("plan.yaml changed on disk; older pending edits were dropped"), 300);
}

load();
</script>
</body>
</html>
