# Project DAG: the single source of structure, status and dates.
# Edited only by the integration owner, through a PR to main. Schema: README.md in this folder.
project: GRACE
updated: 2026-11-22
repo: https://github.com/MouYongli/GRACE   # used to link Issues

milestones:           # plan.md section 9; one milestone per implementation phase
  - id: M0
    title: Novelty check
    depends_on: []
    due: null
    status: planned   # no node registered yet
    gate: >-
      If claim-pattern dependencies are already covered by published dependency keys, claim
      no novelty in granularity and narrow the contribution to two-level staleness, the
      formalisation on append-only bitemporal RDF and the evaluation on natural dialogue.
  - id: M1
    title: Pilot measurements
    depends_on: [M0]
    due: null
    gate: >-
      Few MultiWOZ offer turns: the role claim's primary evidence moves to the controlled
      sequences. Narrow spread of LoCoMo read points: streaming moves to the supplementary
      material. Fragment coverage below one half: lower expectations for RQ1 on LoCoMo. The
      write budget cannot pay back on paper: claim no token savings on LoCoMo. The changes
      missed by citation-based dependencies are rare in natural dialogue: view maintenance
      targets high-revision workloads, with RQ2 resting on the controlled sequences.
  - id: M2
    title: Core mechanism on gold graphs
    depends_on: [M1]
    due: null
    gate: >-
      If template serialisation ties with LLM rendering on reader accuracy, the paper
      becomes "a staleness criterion plus computing at query time" and view maintenance is
      no longer a cost claim. If re-querying at read time is not more expensive anywhere in
      the range of the scale experiment, narrow RQ2 to "freshness checks are cheap".
  - id: M3
    title: End-to-end extraction and planning
    depends_on: [M2]
    due: null
    gate: >-
      If most gains disappear with extracted graphs, conclude that the bottleneck is
      extraction and key alignment, and report how much a larger writer recovers. If the
      view hit rate is low, maintenance conclusions rest on the controlled sequences alone.
  - id: M4
    title: Context assembly and baselines
    depends_on: [M3]
    due: null
    gate: >-
      If tagged hybrid retrieval obtains most of the role gain, narrow the conclusion to
      "role information helps". If the fixed slot table ties on open-domain slices, claim
      no gain from open predicates.
  - id: M5
    title: Vocabulary evolution
    depends_on: [M4]
    due: null
    conditional: true   # only if the frozen vocabulary shows real naming conflicts
    gate: >-
      If a frozen vocabulary with aliases is equally effective, use it in the main
      configuration and report dynamic vocabulary as a negative result.
  - id: M6
    title: Lock and formal evaluation
    depends_on: [M4, M5]
    due: null
    gate: >-
      No tuning after the lock; disclose every deviation from the preregistration.
  - id: M7
    title: Robustness checks
    depends_on: [M6]
    due: null
    gate: >-
      If conclusions hold only on the primary model, restrict the claimed scope.

