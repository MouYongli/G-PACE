# Project DAG: the single source of structure, status and dates.
# Edited only by the integration owner, through a PR to main. Schema: README.md in this folder.
project: G-PACE
updated: 2026-11-22
repo: null            # e.g. https://github.com/<owner>/G-PACE, used to link Issues

milestones:           # plan.md section 9; one milestone per implementation phase
  - id: M1
    title: Pilot measurements
    depends_on: []
    due: null
    gate: >-
      If natural update density is low, state that view maintenance targets high-revision
      workloads and base RQ4 mainly on MultiWOZ, HaluMem and the controlled sequences.
  - id: M2
    title: Core mechanism on gold graphs
    depends_on: [M1]
    due: null
    gate: >-
      If query-pattern dependencies are no better than used-claim dependencies on the
      new-match stratum, or re-querying at read time is equivalent, narrow RQ4 to
      "freshness checks are cheap".
  - id: M3
    title: End-to-end extraction and planning
    depends_on: [M2]
    due: null
    gate: >-
      If most gains disappear with extracted graphs, conclude that the bottleneck is
      extraction and key alignment, and report how much a larger writer recovers.
  - id: M4
    title: Context assembly and baselines
    depends_on: [M3]
    due: null
    gate: >-
      If the role-aware JSON table ties with the graph, report only the joins or scopes
      where the graph adds value.
  - id: M5
    title: Vocabulary evolution
    depends_on: [M4]
    due: null
    conditional: true   # only if the frozen vocabulary shows real naming conflicts
    gate: >-
      If a frozen vocabulary with aliases is equally effective, use it in the main
      configuration and report dynamic vocabulary as a negative result.
  - id: M6
    title: Lock and formal evaluation
    depends_on: [M4, M5]
    due: null
    gate: >-
      No tuning after the lock; disclose every deviation from the preregistration.
  - id: M7
    title: Robustness checks
    depends_on: [M6]
    due: null
    gate: >-
      If conclusions hold only on the primary model, restrict the claimed scope.

