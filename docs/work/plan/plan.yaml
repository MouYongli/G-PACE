# Project DAG: the single source of structure, status and dates.
# Edited only by the integration owner, through a PR to main. Schema: README.md in this folder.
# Nodes are the work items; an edge A -> B (B.depends_on contains A) means A must be resolved before
# B starts. Nodes with no unresolved dependency can run in parallel. Milestones only group nodes.
project: GRACE
updated: 2026-11-25
repo: https://github.com/MouYongli/GRACE   # used to link Issues

end: T036                      # the end node: every milestone node leads to a deliverable
deliverables: [T021, T036]     # preprint, paper
optional:                      # outside the minimal publishable core (research plan section 9.3)
  [E013, D011, T032, E015, T034, E020]

milestones:           # research plan section 9; one milestone per implementation phase
  - id: M0
    title: Novelty check
    due: null
    gate_node: D005   # the decision node that applies this gate
    gate: >-
      If claim-pattern dependencies are already covered by published dependency keys, claim no
      novelty in granularity and narrow the contribution to two-level staleness, the
      formalisation on append-only bitemporal RDF and the evaluation on natural dialogue.
  - id: M1
    title: Pilot measurements
    due: null
    gate_node: D007   # the decision node that applies this gate
    gate: >-
      Few MultiWOZ offer turns: the primary evidence for the attribution-guard claim moves to
      the controlled sequences. Narrow spread of LoCoMo read points: streaming moves to the
      supplementary material. Fragment coverage below one half: lower expectations for RQ1 on LoCoMo. The
      write budget cannot pay back on paper: claim no token savings on LoCoMo. The changes
      missed by citation-based dependencies are rare in natural dialogue: view maintenance
      targets high-revision workloads, with RQ2 resting on the controlled sequences.
  - id: M2
    title: Core mechanism on gold graphs
    due: null
    gate_node: D008   # the decision node that applies this gate
    gate: >-
      If template serialisation ties with LLM rendering on answer accuracy, the paper becomes
      "a staleness criterion plus computing at query time" and view maintenance is no longer a
      cost claim. If re-querying at read time is not more expensive anywhere in the range of
      the scale experiment, narrow RQ2 to "exact staleness checks are cheap". If claim-pattern-level
      decisions over-mark as much as predicate-level decisions on the controlled sequences, the
      RQ2 hypothesis on dependency granularity is overturned and no benefit is claimed for the
      finer dependency.
  - id: M3
    title: End-to-end extraction and planning
    due: null
    gate_node: D009   # the decision node that applies this gate
    gate: >-
      If most gains disappear with extracted graphs, conclude that the bottleneck is
      extraction and key alignment, and report how much a larger writer recovers. If the view
      hit rate is low, maintenance conclusions rest on the controlled sequences alone.
  - id: M4
    title: Context assembly and baselines
    due: null
    gate_node: D010   # the decision node that applies this gate
    gate: >-
      If tagged hybrid retrieval obtains most of the gain attributed to the guard, narrow the
      conclusion to "speaker and dialogue-act information helps". If the fixed slot table ties
      on open-domain slices, claim no gain from open predicates.
  - id: M5
    title: Vocabulary evolution
    due: null
    conditional: true   # only if the frozen vocabulary shows real naming conflicts
    gate: >-
      If a frozen vocabulary with aliases is equally effective, use it in the main
      configuration and report dynamic vocabulary as a negative result.
  - id: M6
    title: Lock and formal evaluation
    due: null
    gate: >-
      No tuning after the lock; disclose every deviation from the preregistration.
  - id: M7
    title: Robustness checks
    due: null
    gate: >-
      If conclusions hold only on the primary model, restrict the claimed scope.

