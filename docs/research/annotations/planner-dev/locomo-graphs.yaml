# LoCoMo part of the T023 planner development subset.
#
# Annotator: agent session m01-T023 (manager of T023). Not a human annotator.
# Source: snap-research/locomo @ 3eb6f2c (CC BY-NC 4.0), development histories conv-26 and
# conv-49 only (configs/benchmarks/locomo.yaml); manifest checksum verified before reading.
#
# Each history holds a PARTIAL claim graph written by hand under the ideal-writer assumptions of
# docs/research/fragment-coverage.md section 1 (text only, stated propositions only, write-time
# time normalisation against the session date). It contains the claims the questions below need
# and distractors from the same or nearby turns that a complete extraction would also contain
# (other trips, other suggestions by the other speaker, other started activities). It is not a
# full extraction of the histories. Questions were picked only where the answer would not change
# under a fuller extraction of the cited turns for reasons outside the query fragment.
#
# Modelling choices (the agent's, for this subset):
# - A suggestion or recommendation by a speaker is an attribution with function `offer` on the
#   claim of what the addressee should do or read (`shouldTry`, `reads`).
# - A trip is an event entity; `tookRoadTrip` links the person to it, with the trip's valid time.
# - Versions are turn positions (1-based, in session order); `messages` maps dia_id to
#   [version, session date]. `reference_date` is the date of the last message of the history (the
#   LoCoMo read tasks carry no asked_at); reads happen at the end of the history (`read_version`).
#
# Claim fields: s, p, o (string literal, or {entity: ID}), start/end/expression (valid time),
# attributions [[speaker, function, dia_id], ...]; evidence defaults to the attribution turns.
