name: Checks
on:
  pull_request:
    branches: [main, 'task/**']
  merge_group:
permissions:
  contents: read
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install pyyaml
      - run: python3 -m unittest discover -s tests -t .
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install ruff
      - run: ruff check .
