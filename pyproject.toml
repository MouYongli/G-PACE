[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpace"
version = "0.0.0"
description = "G-PACE research code"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pyyaml>=6", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
