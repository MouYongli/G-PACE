[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grace"
version = "0.0.0"
description = "GRACE research code"
requires-python = ">=3.12,<3.13"
# CPU-only research code. GPU inference runs in the separate serving environment (envs/serve);
# research code reaches it over its OpenAI-compatible HTTP API (decision D004).
dependencies = [
  "pyyaml>=6",          # configs and plan files
  "numpy>=1.26",        # exact cosine similarity, array maths
  "pyoxigraph>=0.4",    # claim graph store and SPARQL engine
  "rdflib>=7",          # RDF serialisation; required by pyshacl
  "pyshacl>=0.26",      # SHACL validation of claim patches
  "bm25s>=0.2",         # lexical retrieval
  "jsonschema>=4.21",   # validation of structured LLM output
  "openai>=1.40",       # client for the OpenAI-compatible inference server
  "transformers>=4.51", # tokenizer and chat template only, for token counting (no torch)
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "matplotlib>=3.9"]
test = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
