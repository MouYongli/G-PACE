<head>

<title>Fig. 1: Framework overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; background: #ffffff; color: #151A4E; }
  body { font: 400 16px/1.55 'Fira Sans', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 20px 16px 48px; }
  header, figure { width: 100%; max-width: 1240px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1.5px solid #DDE2F8; }
  header a { color: #2B36CE; font-weight: 500; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; }
  header .export { margin-left: auto; display: flex; gap: 8px; }
  header button { font: 500 14px 'Fira Sans', Inter, sans-serif; color: #2B36CE; background: #fff; border: 1.5px solid #2B36CE;
                  border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  header button:hover { background: #EEF1FB; }
  svg { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 20px; color: #5A6082; font-size: 15px; max-width: 860px; }
  figcaption b { color: #151A4E; }
  /* The figure is drawn by the script at the end of the page (helpers: figlib.js).
     Printing to PDF exports the artwork only: no header, no caption. */
  @media print { header, figcaption { display: none; } body { padding: 0; } }

<body>
<header>
  <a href="index.html">&larr; All figures</a>
  <h1>Fig. 1: Framework overview</h1>
</header>
<figure>
<figcaption><b>Fig. 1.</b> Framework overview. GRACE is the context engine: its pipeline layer runs the write path and the read path over a memory layer that only stores. The LLM is outside GRACE and receives the working context through an API. A new message enters both paths. <b>Write path</b> (blue): (1) the message is appended to the log and the text indexes are updated; (2) the writer extracts a claim patch with span anchors; (3) a program validates the patch and, by the attribution guard and the exclusivity rules, appends a claim, supersedes one or keeps both in parallel; (4) the graph transaction commits and produces a change set; (5) affected views are marked and a new version is published. <b>Read path</b> (red): (1) the task is parsed into a typed intermediate representation; (2) the readable version is bound, and graph queries and text retrieval run; (3) resident views are checked for staleness: changed sentences are regenerated, a program patches stale citations, and the engine falls back to raw text on failure; (4) the working context is assembled within the budget; (5) the LLM answers from it alone, and GRACE records the evidence IDs used and the token usage.</figcaption>
</figure>
<script src="figlib.js"></script>
<script>
const W = 1240;   // artwork width

// ================= GRACE container =================
R(214, 26, 812, 614, { rx: 22, fill: "none", stroke: "#8F97E3", sw: 1.8, extra: 'stroke-dasharray="7 6"' });
R(236, 13, 236, 26, { rx: 13, fill: IND });
T(354, 31, "GRACE · CONTEXT ENGINE", { size: 13.5, w: 700, fill: "#fff", anchor: "middle", extra: 'letter-spacing="0.08em"' });

// ================= pipeline layer =================
CARD(226, 62, 786, 308, NAVY);
T(246, 92, "Pipeline layer", { size: 19, w: 700, fill: NAVY });
T(390, 92, "runs the write path and the read path", { size: 14, fill: MUTED });
const PX = [250, 628], PW = 362, PY = 116, PH = 242;
const RY = (i) => PY + 36 + i * 40;   // top of step row i
// [label, note, colour, panel fill, steps]; a step is [title, detail, may call the LLM]
const paths = [
  ["WRITE PATH", "after each message", IND, TINT, [
    ["Append to the log", "update BM25 and dense indexes"],
    ["Extract a claim patch", "writer · span anchors", true],
    ["Validate and decide", "append | supersede | keep in parallel"],
    ["Commit the transaction", "→ change set"],
    ["Mark affected views", "publish a new version"]]],
  ["READ PATH", "for each task", CRI, CRI_T, [
    ["Parse the task", "typed intermediate representation", true],
    ["Bind the version, retrieve", "graph queries · BM25 · dense"],
    ["Check resident views", "regenerate | patch | fall back", true],
    ["Assemble the working context", "within the token budget"],
    ["Record what was used", "evidence IDs · token usage"]]],
];
paths.forEach(([lab, note, col, bg, steps], k) => {
  const x = PX[k];
  R(x, PY, PW, PH, { rx: 12, fill: bg });
  label(x + 16, PY + 24, lab, col);
  T(x + 16 + lab.length * 8.6 + 8, PY + 24, note, { size: 13, fill: MUTED, extra: 'font-style="italic"' });
  P(`M${x + 26},${RY(0) + 12} V${RY(4) + 12}`, col, { head: false, sw: 2 });
  steps.forEach(([t, d, llm], i) => {
    const y = RY(i);
    N(x + 26, y + 12, i + 1, col, 10);
    if (llm) LLM(x + 36, y + 3);
    T(x + 46, y + 17, t, { size: 14.5, w: 500, fill: NAVY });
    M(x + 46, y + 33, d, { size: 11, fill: col });
  });
});

// ================= memory layer =================
CARD(226, 432, 786, 192, IND);
T(246, 462, "Memory layer", { size: 19, w: 700, fill: NAVY });
T(380, 462, "stores only", { size: 14, fill: MUTED });
const MX = [246, 436, 626, 816], MW = 174, MY = 478, SB = [MY + 38, MY + 82];
/** Small monospace pill used inside the memory boxes (smaller than figlib's chip). */
function mini(x, y, s, { fill = TINT, col = NAVY, stroke = "none" } = {}) {
  const w = Math.round(s.length * 6.4 + 11);
  R(x, y, w, 15, { rx: 7.5, fill, stroke, sw: 1.2 });
  T(x + w / 2, y + 11, s, { size: 10.5, fill: col, anchor: "middle", fam: MONO, w: 500 });
  return x + w + 5;
}
const mem = [["Message log", ["Raw messages", "One version each"]],
             ["Text indexes", ["BM25", "Dense"]],
             ["Claim graph", ["Claims, evidence", "Attributions"]],
             ["View store", ["Cited text", "Stale flags"]]];
mem.forEach(([t, ps], i) => {
  const x = MX[i];
  R(x, MY, MW, 130, { rx: 12, fill: TINT });
  T(x + 40, MY + 27, t, { size: 15, w: 700, fill: NAVY });
  ps.forEach((p, j) => {
    R(x + 10, SB[j], MW - 20, 38, { rx: 9, fill: "#fff", stroke: BORDER, sw: 1.2 });
    T(x + 20, SB[j] + 15, p, { size: 12, fill: NAVY, w: 500 });
  });
});
let x, vy, nx;
// --- message log
x = MX[0] + 20; vy = SB[0] + 21;   // a run of messages, newest highlighted
R(x, vy + 2, 28, 9, { rx: 4.5, fill: LIGHT }); R(x + 33, vy + 2, 36, 9, { rx: 4.5, fill: "#fff", stroke: BORDER, sw: 1.2 });
R(x + 74, vy + 2, 18, 9, { rx: 4.5, fill: LIGHT }); R(x + 97, vy + 2, 25, 9, { rx: 4.5, fill: IND });
vy = SB[1] + 20;                    // append-only: one version per message
nx = mini(x, vy, "r1"); nx = mini(nx, vy, "r2"); nx = mini(nx, vy, "r3"); mini(nx, vy, "r4", { fill: IND, col: "#fff" });
// --- text indexes
x = MX[1] + 20; vy = SB[0] + 20;    // BM25: names, numbers, IDs
nx = mini(x, vy, "TR7143"); nx = mini(nx, vy, "20:38"); T(nx + 2, vy + 11, "…", { size: 12, fill: MUTED });
vy = SB[1] + 21;                    // dense: embedding cells
[IND, "#8F97E3", IND, LIGHT, "#5A64DC", TINT2, NAVY, "#8F97E3", IND, LIGHT]
  .forEach((c, i) => R(x + i * 12.4, vy, 10, 10, { rx: 2.5, fill: c }));
// --- claim graph
x = MX[2] + 20; vy = SB[0] + 20;    // a claim with its evidence span
RAW(`<line x1="${x + 10}" y1="${vy + 7.5}" x2="${x + 50}" y2="${vy + 7.5}" stroke="${IND}" stroke-width="2" marker-end="url(#ah-ind)"/>`);
RAW(`<circle cx="${x + 5}" cy="${vy + 7.5}" r="5" fill="${IND}"/><circle cx="${x + 58}" cy="${vy + 7.5}" r="5" fill="#fff" stroke="${IND}" stroke-width="2"/>`);
mini(x + 72, vy, "h2", { fill: IND, col: "#fff" });
vy = SB[1] + 20;                    // speaker and communicative function
nx = mini(x, vy, "offer", { fill: CRI_T, col: CRI }); mini(nx, vy, "accept", { fill: CRI_T, col: CRI });
// --- view store
x = MX[3] + 20; vy = SB[0] + 20;    // text with a citation for every sentence
R(x, vy + 3, 46, 9, { rx: 4.5, fill: LIGHT }); nx = mini(x + 52, vy, "h2", { fill: IND, col: "#fff" }); mini(nx, vy, "h3", { fill: IND, col: "#fff" });
vy = SB[1] + 20;                    // answer-stale and citation-stale
nx = mini(x, vy, "answer", { fill: "#fff", col: CRI, stroke: CRI }); mini(nx, vy, "citation", { fill: "#fff", col: CRI, stroke: CRI });
// --- item icons
const mi = `fill="none" stroke="${IND}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
const iy = MY + 12;
x = MX[0] + 12;   // chat bubble
RAW(`<g ${mi}><path d="M${x + 2},${iy} h18 a3,3 0 0 1 3,3 v9 a3,3 0 0 1 -3,3 h-10 l-5,5 v-5 h-3 a3,3 0 0 1 -3,-3 v-9 a3,3 0 0 1 3,-3 z"/></g>`);
x = MX[1] + 12;   // magnifier
RAW(`<g ${mi}><circle cx="${x + 9}" cy="${iy + 8}" r="7"/><path d="M${x + 14},${iy + 13} l6,6"/></g>`);
x = MX[2] + 12;   // graph
RAW(`<g ${mi}><path d="M${x + 6},${iy + 4} L${x + 18},${iy + 2} M${x + 5},${iy + 7} L${x + 11},${iy + 17} M${x + 19},${iy + 6} L${x + 13},${iy + 17}"/><circle cx="${x + 4}" cy="${iy + 4}" r="3.5" fill="#fff"/><circle cx="${x + 21}" cy="${iy + 2}" r="3.5" fill="${IND}"/><circle cx="${x + 12}" cy="${iy + 19}" r="3.5" fill="#fff"/></g>`);
x = MX[3] + 12;   // card with cite
RAW(`<g ${mi}><rect x="${x}" y="${iy - 1}" width="23" height="21" rx="3.5"/><path d="M${x + 5},${iy + 6} h13 M${x + 5},${iy + 13} h6"/></g>`);

// ================= user card =================
R(6, 10, 176, 240, { rx: 16, fill: TINT, stroke: BORDER, sw: 1.8 });
RAW(`<g fill="none" stroke="${IND}" stroke-width="2.2" stroke-linecap="round"><circle cx="30" cy="29" r="7"/><path d="M18,50 a12,12 0 0 1 24,0"/></g>`);
T(52, 46, "User", { size: 19, w: 700, fill: NAVY });
BUB(46, 61, 128, ["Arrive by 20:45"], { tag: "h1" });
BUB(14, 103, 128, ["TR7143 arrives", "at 20:38."], { kind: "agent", tag: "h2" });
BUB(46, 163, 128, ["Book it."], { tag: "h3" });
// composer: the current question sits in the send box
R(14, 205, 160, 34, { rx: 17, fill: "#fff", stroke: IND, sw: 1.8 });
T(27, 227, "When do I arrive?", { size: 13, fill: NAVY, w: 500 });
RAW(`<circle cx="159" cy="222" r="11" fill="${IND}"/>`);
RAW('<path d="M154,222 h9 M159.5,218 l4,4 -4,4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>');

// ================= LLM card (outside GRACE) =================
const LX = 1096, LW = 126, LCX = LX + LW / 2;
R(LX, 214, LW, 140, { rx: 16, fill: IND });
RAW(`<path d="M${LCX},232 l6,15 15,6 -15,6 -6,15 -6,-15 -15,-6 15,-6 z" fill="#fff"/>`);
T(LCX, 304, "LLM", { size: 22, w: 700, fill: "#fff", anchor: "middle" });
T(LCX, 325, "answers from the", { size: 13, fill: "#DDE2F8", anchor: "middle" });
T(LCX, 342, "working context", { size: 13, fill: "#DDE2F8", anchor: "middle" });
BUB(LX, 400, LW, ["You arrive at", "20:38."], { kind: "reply", cite: "[h2, h3]", citeSize: 12.5 });
RAW(`<circle cx="${LX + LW - 10}" cy="404" r="13" fill="${NAVY}" stroke="#fff" stroke-width="2"/>`);
RAW(`<g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="${LX + LW - 17.5}" y="398.5" width="15" height="11" rx="2"/><path d="M${LX + LW - 17},399.5 l7,5.5 7,-5.5"/></g>`);

// ================= flows =================
// a new message enters GRACE and goes to both paths
P("M170,222 H232", NAVY, { head: false });
C(232, 222, 3.5, NAVY);
P(`M232,222 H${PX[0] - 3}`, IND);
P(`M232,222 V104 H${PX[1] + PW / 2} V${PY - 3}`, CRI);
// pipeline <-> memory
const GX = 431, RX = 809;
P(`M${GX},${PY + PH} V419`, IND); T(GX + 10, 402, "append · commit · mark", { size: 13.5, fill: IND, w: 500 });
P(`M${RX},419 V${PY + PH + 3}`, CRI); T(RX - 10, 402, "graph · text · views", { size: 13.5, fill: CRI, w: 500, anchor: "end" });
// GRACE <-> LLM through the API
const yIn = RY(3) + 12, yOut = RY(4) + 12;
P(`M${PX[1] + PW},${yIn} H${LX - 3}`, CRI);
T(1064, yIn - 20, "working", { size: 12, fill: CRI, w: 500, anchor: "middle" });
T(1064, yIn - 7, "context", { size: 12, fill: CRI, w: 500, anchor: "middle" });
P(`M${LX},${yOut} H${PX[1] + PW + 3}`, NAVY);
T(1064, yOut + 18, "answer", { size: 12, fill: NAVY, w: 500, anchor: "middle" });
// reply to the user
P(`M${LCX},354 V397`, NAVY);
P(`M${LCX},474 V660 H94 V253`, NAVY, { dash: "7 5" });
R(582, 648, 76, 24, { rx: 0, fill: "#fff" }); T(620, 665, "reply", { size: 14.5, fill: NAVY, w: 500, anchor: "middle" });

// ================= legend =================
R(438, 682, 364, 34, { rx: 17, fill: TINT });
RAW(`<line x1="460" y1="699" x2="488" y2="699" stroke="${IND}" stroke-width="3" stroke-linecap="round"/>`); T(498, 704, "write", { size: 14.5, fill: NAVY });
RAW(`<line x1="556" y1="699" x2="584" y2="699" stroke="${CRI}" stroke-width="3" stroke-linecap="round"/>`); T(594, 704, "read", { size: 14.5, fill: NAVY });
RAW(`<circle cx="654" cy="699" r="6" fill="${YEL}"/>`); T(668, 704, "may call the LLM", { size: 14.5, fill: NAVY });

save(728, W);
</script>
</body>
